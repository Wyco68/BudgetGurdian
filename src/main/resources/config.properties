# Budget Guardian — desktop configuration.
#
# On first launch this template is copied to the per-user data directory
# (Windows: %LOCALAPPDATA%\BudgetGuardian\config.properties,
#  macOS: ~/Library/Application Support/BudgetGuardian/config.properties,
#  Linux: ~/.budgetguardian/config.properties)
# — edit THAT copy to change settings; this bundled file is only the default.

# Storage mode:
#   local - SQLite file in the user data directory (works offline, default)
#   api   - REST backend (Node.js + Prisma + Supabase). The desktop never
#           talks to PostgreSQL directly and never holds database credentials.
storage.mode=local

# --- API mode settings (ignored in local mode) -------------------------------

# Base URL of the backend, including the /api/v1 prefix.
api.baseUrl=http://localhost:8080/api/v1

# Timeouts in milliseconds.
api.connectTimeoutMs=3000
api.requestTimeoutMs=10000

# Extra attempts for idempotent requests (GET/PUT) after a transport failure.
api.retries=2

# Shared secret sent as X-API-Key. Leave empty when the backend has no key.
api.key=

# When api.baseUrl points at localhost/127.0.0.1 and the backend isn't
# already running, the desktop starts it itself (as `node src/server.js`)
# and stops it again on exit. Has no effect for a remote baseUrl.
api.autoStartBackend=true

# Folder containing the backend's package.json. Leave empty to look for a
# "backend" folder next to wherever the app was launched from.
api.backendDir=
